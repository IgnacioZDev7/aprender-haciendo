name: Publicar los libros

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Jupyter (ejecuta los bloques de código de los libros)
        run: pip install jupyter matplotlib

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Generar Libro 1 (web y PDF)
        run: quarto render libro1

      - name: Generar Libro 2 (web y PDF)
        run: quarto render libro2

      - name: Armar el sitio
        run: |
          mkdir -p sitio
          cp -r libro1/_book sitio/libro1
          cp -r libro2/_book sitio/libro2
          cp portada/index.html sitio/index.html
          cp -r portada/img sitio/img

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
