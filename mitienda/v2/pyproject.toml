[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mitienda"
version = "2.0.0"
description = "Sistema de ventas para una tienda de barrio (proyecto del Libro 2 de la serie Aprender Haciendo)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
mitienda = "mitienda.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
# N818 pide que las excepciones terminen en "Error"; usamos nombres en español.
ignore = ["N818"]
